# Legacy fallback allowlist (personal profiles). Prefer:
#   manifest/secrets-allowlist-macbook-pro-2023.conf
#   manifest/secrets-allowlist-mac-consensys.conf
# Lines: aws_profile:<exact-name>  or  aws_profile_pattern:<regex>
# Work/Consensys profiles are excluded by omission.

aws_profile:default
aws_profile:home
aws_profile_pattern:^synkube
aws_profile_pattern:^ent-aws
aws_profile_pattern:^lite-do
